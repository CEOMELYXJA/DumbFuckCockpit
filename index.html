<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QG – Cockpit de vie</title>
<style>
:root{--bg:#070b15;--bg2:#0d1424;--ln:#25365a;--tx:#e6f0ff;--dm:#8ea6c9;--am:#ffb347;--cy:#4fd1e8;--mg:#ff4d8d;--ok:#8be36a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#edf2fa;--bg2:#fff;--ln:#b6c6de;--tx:#10243f;--dm:#53698a;--am:#b86a00;--cy:#00758f;--mg:#c4115f;--ok:#25892f}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--tx);font:15px/1.4 Bahnschrift,"DIN Alternate","Arial Narrow",system-ui,sans-serif;background:radial-gradient(900px 500px at 10% -10%,color-mix(in srgb,var(--cy) 16%,transparent),transparent),radial-gradient(800px 500px at 100% 0,color-mix(in srgb,var(--mg) 14%,transparent),transparent),var(--bg);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:9}
main{max-width:1050px;margin:0 auto;padding:14px}
h2{font-size:18px;margin:0 0 8px}
.pn{background:linear-gradient(160deg,color-mix(in srgb,var(--bg2) 92%,#fff),var(--bg2));border:1px solid var(--ln);border-radius:16px;padding:14px;margin-top:12px;box-shadow:0 10px 30px -18px #000}
.hub{display:flex;gap:14px;align-items:center}
.ring{position:relative;width:84px;height:84px;flex:none;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;width:100%;height:100%}
.ring b{font-size:30px;color:var(--cy);text-shadow:0 0 16px var(--cy)}
.sweep{position:absolute;inset:-5px;border-radius:50%;background:conic-gradient(from 0deg,transparent 70%,color-mix(in srgb,var(--cy) 55%,transparent));-webkit-mask:radial-gradient(circle,transparent 62%,#000 64%);mask:radial-gradient(circle,transparent 62%,#000 64%);animation:sp 5s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.hub>div:last-child{flex:1}.hub h1{margin:0;font-size:24px}
.xpb,.bar{height:7px;background:var(--ln);border-radius:4px;overflow:hidden;margin-top:5px}
.xpb i,.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--ok));border-radius:4px;transition:width .4s}
small,.dm{color:var(--dm);font-size:12.5px}
#gs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}
.g{text-align:center;font-size:12px;color:var(--dm)}.g svg{width:100%;max-width:84px}
.g circle{fill:none;stroke-width:7;transform:rotate(-90deg);transform-origin:center;transform-box:fill-box}
.g .bg{stroke:var(--ln)}.g .fg{stroke-linecap:round;transition:stroke-dasharray .5s;filter:drop-shadow(0 0 4px currentColor)}
.g text{fill:var(--tx);font-size:15px;font-weight:700}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:10px;font-size:13px;color:var(--dm)}
input{background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:5px 7px;font:inherit}
input[type=number]{width:92px}input[type=range]{padding:0;accent-color:var(--am)}
.alert{margin-top:10px;padding:8px 10px;border-radius:10px;border:1px solid var(--mg);color:var(--mg);font-size:13px}
#map{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.t{--c:#fff;position:relative;background:radial-gradient(circle at 50% 0,color-mix(in srgb,var(--c) 30%,transparent),transparent 72%),var(--bg2);border:1px solid color-mix(in srgb,var(--c) 40%,var(--ln));border-radius:14px;padding:10px 6px 9px;text-align:center;cursor:pointer;color:var(--tx);font:inherit;min-height:112px;transition:transform .15s,box-shadow .2s}
.t:hover{transform:translateY(-2px)}
.t.on{border-color:var(--c);box-shadow:0 0 20px -3px var(--c)}
.t .i{font-size:30px;display:block;filter:drop-shadow(0 0 6px var(--c))}
.t small{display:block}.pip{color:var(--c);font-size:10px;letter-spacing:1px;min-height:13px}
.t .bar{margin:6px 8px 0}.t .bar i{background:var(--c)}
button{background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:9px;padding:7px 11px;font:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--am);outline-offset:2px}
button.p{border-color:var(--am);color:var(--am)}button:disabled{opacity:.45;cursor:default}
.qs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.q{display:flex;align-items:center;gap:10px;text-align:left;width:100%;padding:10px}
.q .bx{width:22px;height:22px;border-radius:7px;border:2px solid var(--zc);display:grid;place-items:center;flex:none;font-size:15px;color:var(--bg)}
.q.d{background:color-mix(in srgb,var(--zc) 16%,var(--bg));border-color:var(--zc)}
.q.d .bx{background:var(--zc)}.q.d span{color:var(--dm);text-decoration:line-through}
.q em{margin-left:auto;font-style:normal;color:var(--am);font-size:12px}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:8px 16px}
.st{display:flex;align-items:center;gap:6px;font-size:13.5px}.st>div{flex:1}
.st button{padding:3px 9px}
.st .bar i{background:var(--zc)}
#live{display:grid;grid-template-columns:minmax(200px,260px) 1fr;gap:14px;align-items:center;margin-bottom:12px}
@media(max-width:620px){#live{grid-template-columns:1fr}}
.sb{fill:none;stroke:var(--ln);stroke-width:12;stroke-linecap:round}
.sf{fill:none;stroke:var(--am);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--am));transition:stroke-dasharray .4s}
#live svg text{fill:var(--tx);text-anchor:middle}
.rd{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px}
.rd div{background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:6px 8px}.rd b{display:block;font-size:18px}
#ts{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--am);color:#111;padding:8px 16px;border-radius:20px;font-weight:700;opacity:0;pointer-events:none;z-index:10}
#ts.s{animation:ts 1.1s}@keyframes ts{0%{opacity:0;transform:translate(-50%,10px)}15%,70%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main>
<section class="pn" style="margin-top:0"><div id="hub" class="hub"></div><div id="gs"></div>
<div class="row"><label>Revenus du mois <input type="number" id="rev" min="0"></label><label>Objectif <input type="number" id="goal" min="0"></label><label>Énergie du jour <input type="range" id="en" min="0" max="100"></label></div><div id="al"></div></section>
<section class="pn"><h2>Carte de ton monde</h2><div id="map"></div></section>
<section class="pn" id="pan"></section>
<p class="row"><button data-a="mo">Nouveau mois (remet les compteurs à zéro)</button></p>
</main><div id="ts" role="status"></div>
<script>
const D=[
["tat","Boutique","🖋️","#ff4d8d","Séances|20|1;Heures tatouées|80|2;Nouveaux clients|10|1;Retouches|6|1;Flashs dessinés|12|1;Dépôts reçus|15|1;Annulations|3|1;Consultations|12|1;Photos de pièces|15|1;Avis reçus|5|1;Aiguilles changées|40|5;Stérilisations|20|1;Machines entretenues|10|1;Cartes-cadeaux vendues|4|1;Pauses prises|30|1;Pauses d’étirement|30|1","Répondre aux demandes;Dessiner un flash 20 min;Préparer le poste de demain;Photographier une pièce terminée;Entretenir une machine"],
["ate","Atelier 3D","🖨️","#8be36a","Impressions lancées|15|1;Impressions réussies|13|1;Heures d’impression|60|4;Filament utilisé (g)|1000|50;Produits vendus|10|1;Nouveaux modèles|4|1;Porte-clés faits|20|1;Pièces sur mesure|5|1;Photos produit|10|1;Annonces publiées|6|1;Commandes expédiées|10|1;Pièces d’entretien|3|1;Tests de réglage|5|1;Supports de tatouage|3|1;Prototypes électroniques|2|1","Lancer une impression;Vérifier le lit d’impression;Photographier un produit;Publier une annonce;Dessiner un modèle 30 min"],
["dro","Studio drone","🚁","#4fd1e8","Vols|8|1;Minutes de vol|120|10;Vidéos tournées|6|1;Vidéos livrées|4|1;Montages finis|4|1;Commerces contactés|15|1;Soumissions vidéo|6|1;Contrats conclus|3|1;Batteries chargées|16|1;Hélices vérifiées|4|1;Clips en mode suivi|10|1;Plans cinéma réussis|20|1;Photos aériennes|30|5;Portfolio mis à jour|2|1;Lieux repérés|8|1;Revenus vidéo ($)|1500|50","Contacter un commerce;Charger les batteries;Monter 15 min de vidéo;Repérer un lieu de tournage;Ajouter un clip au portfolio"],
["gar","Garage trottinette","🛴","#ffb347","Km parcourus|200|5;Sorties|12|1;Recharges|12|1;Tests de batterie|4|1;Pression des pneus|8|1;Freins vérifiés|8|1;Visserie serrée|4|1;Nettoyages|4|1;Éclairage vérifié|6|1;Mise à jour firmware|1|1;Mods installés|2|1;Trajets GPS enregistrés|10|1;Clips de sortie|10|1;Contenus publiés|8|1;Records battus|3|1;Défis relevés|6|1;Marche d’hiver (min)|300|15","Vérifier batterie et pneus;Faire une sortie 20 min;Enregistrer un trajet GPS;Filmer un clip;Nettoyer et graisser"],
["lab","Labo code","💻","#a78bfa","Heures codées|30|1;Versions publiées|4|1;Bogues corrigés|20|1;Fonctions ajoutées|12|1;Essais sur téléphone|15|1;Déploiements|8|1;Idées notées|15|1;Refontes visuelles|3|1;Apps en chantier|5|1;Tests Bluetooth|6|1;Tests GPS|6|1;Sauvegardes|8|1;Apprentissages|10|1;Utilisateurs invités|10|1;Retours reçus|8|1","Coder 30 minutes;Corriger un bogue;Noter une idée;Tester sur le téléphone;Publier une version"],
["ban","Banque","💰","#ffd166","Soumissions envoyées|10|1;Clients conclus|5|1;Factures envoyées|10|1;Paiements reçus|10|1;Dépenses notées|20|1;Suivis clients|15|1;Offres lancées|3|1;Revenus tatouage ($)|4000|100;Revenus 3D ($)|500|25;Revenus drone ($)|1000|50;Revenus apps ($)|300|25;Dettes payées ($)|1000|50;Économies ($)|500|25;Abonnements coupés|3|1;Idées de revenus testées|4|1;Prix révisés|2|1","Envoyer une soumission;Faire un suivi client;Noter les dépenses du jour;Envoyer une facture;Tester une idée de revenu"],
["cor","Corps","🔋","#5eead4","Sorties dehors|20|1;Nuits reposantes|20|1;Étirements (min)|300|10;Verres d’eau|120|8;Vrais repas|60|1;Pauses de 5 min|60|1;Marches|15|1;Raquette|6|1;Jours sans douleur au dos|15|1;Séances de bougeotte|10|1;Lumière du jour (min)|300|15;Jours de repos complets|4|1;Respirations guidées|15|1","Étirements 10 minutes;Vrai repas;Sortir dehors 20 min;Verre d’eau et pause;Se coucher à l’heure"],
["mai","Maison connectée","🏠","#fb923c","Routines automatisées|5|1;Lumières connectées|6|1;Capteurs installés|4|1;Prises intelligentes|4|1;Scènes d’éclairage|5|1;Chauffage programmé|3|1;Refroidissement programmé|2|1;Montages électroniques|3|1;Soudures|10|1;Boîtiers imprimés|4|1;Économies d’énergie|5|1;Pannes réglées|3|1;Pièces recyclées|2|1","Automatiser une lumière;Tester un montage;Ranger l’établi;Souder ou câbler 20 min"],
["cry","Crypto","🪙","#facc15","Veilles de marché|20|1;Projets étudiés|10|1;Mis de côté ($)|300|25;Portefeuilles sécurisés|3|1;Phrases sauvegardées sur papier|2|1;Paiements crypto reçus|2|1;Articles lus|15|1;Arnaques repérées|5|1;Outils testés|4|1;Dépôts boutique en crypto|2|1","Lire un article 10 min;Vérifier la sécurité d’un portefeuille;Étudier un projet avant d’y toucher"],
["vr","VR et AR","🥽","#c084fc","Heures de casque|20|1;Apps essayées|10|1;Prototypes AR|3|1;Scènes 3D créées|5|1;Modèles de tatouage en AR|5|1;Visites virtuelles|3|1;Fonds animés créés|6|1;Captures VR|8|1;Mises à jour du casque|2|1;Jeux testés|8|1;Essais WebXR|4|1","Essayer une app VR;Modéliser un objet 3D;Tester un effet AR;Créer un fond d’écran animé"],
["arc","Arcade","🕹️","#f43f5e","Parties jouées|30|1;Hauts scores battus|5|1;Mini-jeux créés|3|1;Niveaux conçus|8|1;Idées de jeu|10|1;Manettes recyclées|2|1;Étapes Game Boy réutilisée|5|1;Défis entre amis|4|1;Classements consultés|8|1;Musiques créées|5|1;Sprites dessinés|20|2","Jouer 15 minutes;Dessiner un sprite;Concevoir un niveau;Battre un record"],
["soc","Contenu et réseaux","📣","#38bdf8","Publications|20|1;Vidéos courtes|8|1;Stories|30|2;Photos de réalisations|20|1;Messages répondus|40|2;Collaborations|2|1;Idées de contenu|15|1;Séries planifiées|3|1;Abonnés gagnés|100|10;Partages reçus|20|2;Tests de contenu viral|3|1;Lives|2|1;Mots-clics régionaux testés|10|1;Statistiques analysées|4|1","Publier un contenu;Répondre aux messages;Filmer un clip;Noter une idée de contenu"],
["app","Apparence","🎨","#f472b6","Thèmes créés|3|1;Fonds animés|5|1;Icônes dessinées|20|2;Widgets conçus|5|1;Menus personnalisés|4|1;Palettes testées|8|1;Animations d’interface|6|1;Captures partagées|6|1;Thèmes vendus|3|1;Packs publiés|2|1","Dessiner une icône;Tester une palette;Animer un élément;Créer un fond d’écran"]
];
const Z=D.map(([id,n,i,c,s,q])=>({id,n,i,c,s:s.split(";").map(x=>{const a=x.split("|");return[a[0],+a[1],+a[2]]}),q:q.split(";")}));
const $=s=>document.querySelector(s),KEY="qg-v2";
const day=(o=0)=>{const d=new Date();d.setDate(d.getDate()-o);return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()};
let S={xp:0,pts:0,streak:0,last:"",rev:0,goal:5000,en:70,lvl:{},v:{},done:{d:"",i:{}},sel:"gar"};
try{const r=localStorage.getItem(KEY)||localStorage.getItem("qg-v1");if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
if(S.done.d!==day())S.done={d:day(),i:{}};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const lv=z=>S.lvl[z]||1,val=k=>S.v[k]||0;
const prog=z=>z.s.reduce((a,s,i)=>a+Math.min(1,val(z.id+i)/s[1]),0)/z.s.length;
const g=(l,p,t,c)=>`<div class="g"><svg viewBox="0 0 90 90" style="color:${c}"><circle cx="45" cy="45" r="36" class="bg"/><circle cx="45" cy="45" r="36" class="fg" style="stroke:${c};stroke-dasharray:${Math.min(1,Math.max(0,p))*226.2} 226.2"/><text x="45" y="50" text-anchor="middle">${t}</text></svg>${l}</div>`;
function toast(t){const e=$("#ts");e.textContent=t;e.classList.remove("s");void e.offsetWidth;e.classList.add("s")}
/* GPS et Bluetooth */
let G={on:false,id:null,d:0,max:0,t0:0,last:null,sp:0,alt:null,hd:null,acc:null,err:"",ms:0},B={dev:null,name:"",bat:null,err:""};
const hav=(a,b)=>{const r=Math.PI/180,x=(b.latitude-a.latitude)*r,y=(b.longitude-a.longitude)*r,h=Math.sin(x/2)**2+Math.cos(a.latitude*r)*Math.cos(b.latitude*r)*Math.sin(y/2)**2;return 12742*Math.asin(Math.sqrt(h))};
function gpsOn(){if(!navigator.geolocation){G.err="GPS indisponible sur cet appareil";return Lv()}
 G.on=true;G.err="";G.t0=Date.now()-G.ms;
 G.id=navigator.geolocation.watchPosition(p=>{const c=p.coords;G.acc=c.accuracy;G.alt=c.altitude;G.hd=c.heading;G.sp=c.speed!=null?c.speed*3.6:0;G.max=Math.max(G.max,G.sp);
  if(G.last&&c.accuracy<50){const d=hav(G.last,c);if(d<0.3&&G.sp>1){G.d+=d;S.v.gar0=+(val("gar0")+d).toFixed(3)}}
  G.last={latitude:c.latitude,longitude:c.longitude};save();Lv()},
 e=>{G.err=e.code===1?"Permission refusée : ouvre la page directement dans ton navigateur.":"Signal GPS indisponible";gpsOff()},{enableHighAccuracy:true,maximumAge:1000})}
function gpsOff(){if(G.id!=null)navigator.geolocation.clearWatch(G.id);G.id=null;G.on=false;G.sp=0;Lv()}
async function btOn(){try{if(!navigator.bluetooth){B.err="Bluetooth web indisponible : utilise Chrome sur Android ou Bluefy sur iPhone.";return Lv()}
 const d=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:["battery_service"]});
 B.dev=d;B.name=d.name||"Appareil sans nom";B.err="";d.addEventListener("gattserverdisconnected",()=>{B.dev=null;B.bat=null;Lv()});
 const s=await d.gatt.connect();
 try{const c=await(await s.getPrimaryService("battery_service")).getCharacteristic("battery_level");B.bat=(await c.readValue()).getUint8(0)}catch(e){B.bat=null;B.err="Connecté. Cet appareil n’expose pas sa batterie de façon standard."}
 Lv()}catch(e){B.err=e.name==="NotFoundError"?"Aucun appareil choisi":"Bluetooth refusé ou bloqué par la page";Lv()}}
const cap=h=>h==null||isNaN(h)?"–":["N","NE","E","SE","S","SO","O","NO"][Math.round(h/45)%8];
function Lv(){const e=$("#live");if(!e)return;const t=G.ms/3600000;if(G.on)G.ms=Date.now()-G.t0;
 const hm=s=>{s=Math.floor(s/1000);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")},av=G.ms>5000?G.d/(G.ms/3600000):0;
 e.innerHTML=`<svg viewBox="0 0 170 105"><path d="M15 85A70 70 0 0 1 155 85" class="sb"/><path d="M15 85A70 70 0 0 1 155 85" class="sf" style="stroke-dasharray:${Math.min(1,G.sp/50)*219.9} 220"/><text x="85" y="76" font-size="30" font-weight="700">${G.sp.toFixed(0)}</text><text x="85" y="95" font-size="11" style="fill:var(--dm)">km/h</text></svg>
 <div><div class="rd"><div><small>Distance</small><b>${G.d.toFixed(2)} km</b></div><div><small>Vitesse max</small><b>${G.max.toFixed(0)} km/h</b></div><div><small>Vitesse moy.</small><b>${av.toFixed(1)} km/h</b></div><div><small>Durée</small><b>${hm(G.ms)}</b></div><div><small>Altitude</small><b>${G.alt!=null?G.alt.toFixed(0)+" m":"–"}</b></div><div><small>Cap</small><b>${cap(G.hd)}</b></div><div><small>Précision GPS</small><b>${G.acc!=null?"±"+G.acc.toFixed(0)+" m":"–"}</b></div><div><small>Bluetooth</small><b>${B.dev?B.name:"–"}</b></div><div><small>Batterie</small><b>${B.bat!=null?B.bat+" %":"–"}</b></div></div>
 <div class="row"><button class="p" data-a="gps">${G.on?"Arrêter le GPS":"Démarrer le GPS"}</button><button data-a="bt">${B.dev?"Déconnecter":"Connecter le Bluetooth"}</button><button data-a="gr">Nouveau trajet</button></div>
 <small style="color:var(--mg)">${G.err||B.err}</small></div>`}
setInterval(()=>{if(G.on)Lv()},1000);
/* Affichage */
function R(){
 const LV=Math.floor(S.xp/100)+1,x=S.xp%100,nd=Object.values(S.done.i).filter(Boolean).length,nq=Z.reduce((a,z)=>a+z.q.length,0),rp=S.goal?S.rev/S.goal:0;
 $("#hub").innerHTML=`<div class="ring"><div class="sweep"></div><svg viewBox="0 0 90 90"><circle cx="45" cy="45" r="38" fill="none" stroke="var(--ln)" stroke-width="5"/><circle cx="45" cy="45" r="38" fill="none" stroke="var(--cy)" stroke-width="5" stroke-linecap="round" transform="rotate(-90 45 45)" stroke-dasharray="${x/100*238.8} 239"/></svg><b>${LV}</b></div><div><h1>QG – Cockpit de vie</h1><div class="xpb"><i style="width:${x}%"></i></div><small>${x}/100 XP · <span style="color:var(--am)">${S.pts} points</span> · série de ${S.streak} jour${S.streak>1?"s":""}</small></div>`;
 $("#gs").innerHTML=g("Niveau "+LV,x/100,x+"/100","var(--cy)")+g("Série",S.streak/14,S.streak+" j","var(--mg)")+g("Quêtes",nd/nq,nd+"/"+nq,"var(--ok)")+g("Revenus",rp,Math.round(rp*100)+"%","var(--am)")+g("Énergie",S.en/100,S.en+"%",S.en<35?"var(--mg)":"var(--ok)");
 $("#al").innerHTML=S.en<35?'<div class="alert">Énergie basse : choisis une quête douce (Corps, Maison) et laisse le reste à demain.</div>':"";
 $("#rev").value=S.rev;$("#goal").value=S.goal;$("#en").value=S.en;
 $("#map").innerHTML=Z.map(z=>{const qd=z.q.filter((_,j)=>S.done.i[z.id+j]).length;return`<button class="t ${S.sel===z.id?"on":""}" style="--c:${z.c}" data-a="sel" data-z="${z.id}"><span class="i">${z.i}</span>${z.n}<div class="pip">${"◆".repeat(lv(z.id))}</div><small>${qd}/${z.q.length} quêtes · ${z.s.length} stats</small><div class="bar"><i style="width:${prog(z)*100}%"></i></div></button>`}).join("");
 const z=Z.find(a=>a.id===S.sel),cost=30*lv(z.id);
 $("#pan").style.setProperty("--zc",z.c);
 $("#pan").innerHTML=`<h2>${z.i} ${z.n} – niveau ${lv(z.id)}</h2>`+(z.id==="gar"?'<div id="live"></div>':"")+
 `<small>Quêtes du jour : chaque case cochée donne 10 points. Chaque stat ajoutée donne ${lv(z.id)} XP.</small><div class="qs" style="margin:8px 0 14px">`+
 z.q.map((t,j)=>{const k=z.id+j,d=S.done.i[k];return`<button class="q ${d?"d":""}" data-a="q" data-k="${k}" role="checkbox" aria-checked="${!!d}"><span class="bx">${d?"✓":""}</span><span>${t}</span><em>+10</em></button>`}).join("")+
 `</div><div class="sg">`+z.s.map((s,i)=>{const k=z.id+i;return`<div class="st"><div>${s[0]} : <b>${val(k)}</b> / ${s[1]}<div class="bar"><i style="width:${Math.min(100,val(k)/s[1]*100)}%"></i></div></div><button data-a="t" data-k="${k}" data-d="-${s[2]}" aria-label="Retirer ${s[2]} à ${s[0]}">−</button><button class="p" data-a="t" data-k="${k}" data-d="${s[2]}" data-z="${z.id}" aria-label="Ajouter ${s[2]} à ${s[0]}">+${s[2]}</button></div>`}).join("")+
 `</div><p><button class="p" data-a="up" data-z="${z.id}" ${S.pts<cost?"disabled":""}>Améliorer cette zone (${cost} points)</button></p>`;
 Lv();save()}
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,k=b.dataset.k,z=b.dataset.z;
 if(a==="sel")S.sel=z;
 else if(a==="t"){const d=+b.dataset.d;S.v[k]=Math.max(0,val(k)+d);if(d>0){S.xp+=lv(z);toast("+"+lv(z)+" XP")}}
 else if(a==="q"){const on=!S.done.i[k];S.done.i[k]=on;S.xp=Math.max(0,S.xp+(on?10:-10));S.pts=Math.max(0,S.pts+(on?10:-10));
  if(on){toast("+10 points");if(S.last!==day()){S.streak=S.last===day(1)?S.streak+1:1;S.last=day()}}}
 else if(a==="up"){const c=30*lv(z);if(S.pts>=c){S.pts-=c;S.lvl[z]=lv(z)+1;toast("Zone niveau "+lv(z))}}
 else if(a==="gps"){G.on?gpsOff():gpsOn();return}
 else if(a==="bt"){B.dev?B.dev.gatt.disconnect():btOn();return}
 else if(a==="gr"){G.d=0;G.max=0;G.ms=0;G.t0=Date.now();G.last=null;Lv();return}
 else if(a==="mo"){S.v={};S.rev=0}
 R()});
["rev","goal","en"].forEach(id=>$("#"+id).addEventListener("input",e=>{S[id]=+e.target.value||0;R()}));
R();
</script></body></html>
