name: DumbFuckCockpit Widget package

on:
  workflow_dispatch:
  push:
    branches:
      - desktop/orchestrator-layer-prototype-2026-10-28
      - main
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-widget.yml'
      - 'index.html'
      - 'tasks.js'
      - 'tasks.css'
      - 'manifest.webmanifest'
      - 'service-worker.js'
      - 'icon.svg'

permissions:
  contents: read

jobs:
  windows-package:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install packages and build the native Windows host
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Create installer and portable package
        working-directory: desktop
        run: npm run package

      - name: Upload the Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: DumbFuckCockpit-Widget-Windows
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 30

  publish-release:
    if: github.ref == 'refs/heads/main'
    needs: windows-package
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: DumbFuckCockpit-Widget-Windows
          path: release

      - name: Publish permanent Windows download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = node -p "require('./desktop/package.json').version"
          $tag = "dumbfuckcockpit-widget-v$version"
          $installer = Get-ChildItem "release/DumbFuckCockpit-Widget-$version-*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Installateur Windows introuvable pour la version $version." }
          & gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            & gh release upload $tag $installer.FullName --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            & gh release create $tag $installer.FullName --repo $env:GITHUB_REPOSITORY --title "DumbFuckCockpit Widget $version" --notes-file desktop/RELEASE_NOTES.md --latest
          }
          if ($LASTEXITCODE -ne 0) { throw "Publication de la version Windows échouée." }

